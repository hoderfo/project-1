<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online C IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">C IDE</div>
            <div class="controls">
                <button id="btn-run">Run</button>
                <button id="btn-debug">Debug</button>
                <button id="btn-debug-start" class="debug-only">Start</button>
                <button id="btn-continue" class="debug-only">Continue</button>
                <button id="btn-step-over" class="debug-only">Step Over</button>
                <button id="btn-step-into" class="debug-only">Step Into</button>
                <button id="btn-stop">Stop</button>
            </div>
            <div class="user-controls" id="user-controls">
                <button id="btn-save">Save</button>
                <input type="text" id="share-link" readonly placeholder="Share Link">
                <span id="user-greeting"></span>
                <button id="btn-login">Login / Register</button>
                <button id="btn-logout">Logout</button>
            </div>
        </header>
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="auth-close">&times;</span>
                <h2 id="auth-title">Login</h2>
                <div id="auth-error" class="error-msg"></div>
                
                <input type="text" id="auth-username" placeholder="Username" class="auth-input">
                <input type="password" id="auth-password" placeholder="Password" class="auth-input">
                
                <button id="auth-submit" class="auth-submit-btn">Login</button>
                <div class="auth-switch">
                    <span id="auth-switch-text">Don't have an account? </span>
                    <a href="#" id="auth-switch-link">Register</a>
                </div>
            </div>
        </div>
        
        <main>
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h3>Files</h3>
                    <button id="btn-add-file" title="Add File">+</button>
                </div>
                <ul id="file-list">
                </ul>
            </aside>
            <div class="resizer resizer-vertical" id="sidebar-resizer" title="Resize files panel"></div>
            <div id="editor-container"></div>
            <div class="resizer resizer-vertical" id="right-panel-resizer" title="Resize output panel"></div>
            
            <div id="right-panel">
                <div id="debugger-panel">
                    <section class="debug-section" data-section="callstack">
                        <button class="debug-section-header" type="button">
                            <span class="debug-chevron">v</span>
                            <span>Call Stack</span>
                        </button>
                        <div class="debug-section-body">
                            <div id="callstack-list" class="debug-empty">Start debugging to inspect stack frames.</div>
                        </div>
                    </section>

                    <section class="debug-section" data-section="locals">
                        <button class="debug-section-header" type="button">
                            <span class="debug-chevron">v</span>
                            <span>Local Variables</span>
                        </button>
                        <div class="debug-section-body">
                            <div id="variables-list" class="debug-empty">Start debugging to inspect local variables.</div>
                        </div>
                    </section>

                    <section class="debug-section" data-section="breakpoints">
                        <button class="debug-section-header" type="button">
                            <span class="debug-chevron">v</span>
                            <span>Breakpoints and Watchpoints</span>
                        </button>
                        <div class="debug-section-body">
                            <div id="breakpoints-list" class="debug-empty">No breakpoints set.</div>
                        </div>
                    </section>
                </div>
                <div class="resizer resizer-horizontal" id="debugger-resizer" title="Resize variables panel"></div>
                
                <div id="terminal-container"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
